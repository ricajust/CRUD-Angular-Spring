<mat-card class="column-flex">
    <div class="mat-elevation-z8">
        <mat-toolbar color="primary">
            Cursos disponíveis
        </mat-toolbar>
        <app-courses-list
            [courses]="courses"
            (add)="onAdd()"
            *ngIf="courses$ | async as courses; else loading">
        </app-courses-list>
        <ng-template #loading>
            <div class="loading-spinner">
                <mat-spinner></mat-spinner>
            </div>
        </ng-template>
    </div>
</mat-card>
